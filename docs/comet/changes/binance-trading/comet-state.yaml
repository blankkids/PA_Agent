    reason:
      text: 现货市价闭环含撤单/平仓留痕；通过：代码强制点+SDK 签名内省交叉核实+测试证据（见 checks_run）
      truncated: false
  - id: A2
    source: brief.md
    text: "**现货 TP 分批**：决策带 TP1+TP2 → 确认后挂两组 OCO（TP1 半量+SL 半量 / TP2 半量+SL 半量）；TP1
      成交后 OCO1 SL 腿联动取消，剩余半量由 OCO2 保护"
    result: passed
    reason:
      text: 双 OCO 各半同 SL；通过：代码强制点+SDK 签名内省交叉核实+测试证据（见 checks_run）
      truncated: false
